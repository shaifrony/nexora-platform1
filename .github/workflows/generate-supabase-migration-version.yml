name: Generate Supabase migration version

on:
  push:
    branches:
      - nexora-development
    paths:
      - ".github/workflows/generate-supabase-migration-version.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: nexora-development

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify CLI and generate a unique migration filename
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new product_linked_private_conversations
          mapfile -t generated < <(find supabase/migrations -maxdepth 1 -type f -name '*_product_linked_private_conversations.sql' -print)
          if [ "${#generated[@]}" -ne 1 ]; then
            echo "Expected exactly one generated migration file; found ${#generated[@]}."
            exit 1
          fi
          generated_file="${generated[0]}"
          generated_name="$(basename "$generated_file")"
          generated_version="${generated_name%%_*}"
          if [[ ! "$generated_version" =~ ^[0-9]{14}$ ]]; then
            echo "CLI returned an unexpected migration version: $generated_version"
            exit 1
          fi
          if [ "$generated_version" -le "20261114190000" ]; then
            echo "Generated version does not sort after the delivery tracking dependency: $generated_version"
            exit 1
          fi
          if [ -f "supabase/migrations/$generated_name" ] && git ls-files --error-unmatch "supabase/migrations/$generated_name" >/dev/null 2>&1; then
            echo "Generated migration path already tracked; refusing collision."
            exit 1
          fi
          echo "Generated migration: $generated_name"
          echo "Generated version: $generated_version"
          printf '%s\n' "$generated_name" > /tmp/generated-migration-name.txt

      - name: Upload generated empty migration file
        uses: actions/upload-artifact@v4
        with:
          name: nexora-generated-migration-version
          path: |
            supabase/migrations/*_product_linked_private_conversations.sql
          if-no-files-found: error
          retention-days: 3
