
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>NEXORA | Global Trade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="#">NEXORA
    <small>GLOBAL TRADE</small>
  </a>
  <button id="accountBtn">অ্যাকাউন্ট</button>
</header>

<main>
<section class="hero">
  <p class="eyebrow">BUY · SELL · CONNECT</p>
  <h1>বিশ্ববাণিজ্যের নতুন সংযোগ</h1>
  <p>বিশ্বের ক্রেতা ও বিক্রেতাকে যুক্ত করুন এক প্ল্যাটফর্মে।</p>
  <a class="primary" href="#market">পণ্য খুঁজুন</a>
</section>

<section class="searchbar" id="market">
  <input id="q" placeholder="পণ্য খুঁজুন">
  <select id="cat">
    <option value="">সব ক্যাটাগরি</option>
    <option>Food & Agriculture</option>
    <option>Textile</option>
    <option>Manufacturing</option>
    <option>Electronics</option>
  </select>
</section>

<section class="section">
  <h2>পণ্যের বাজার</h2>
  <div id="list" class="grid"></div>
</section>

<section class="panel">
  <h2>বিক্রেতা হিসেবে পণ্য যোগ করুন</h2>
  <form id="addForm">
    <input name="name" placeholder="পণ্যের নাম" required>
    <input name="country" placeholder="দেশ" required>
    <select name="category">
      <option>Food & Agriculture</option>
      <option>Textile</option>
      <option>Manufacturing</option>
      <option>Electronics</option>
    </select>
    <input name="price" placeholder="পণ্যের দাম">
    <textarea name="details" placeholder="পণ্যের বিবরণ"></textarea>
    <button class="primary" type="submit">পণ্য যোগ করুন</button>
  </form>
</section>

<section class="ad">
  <b>Advertisement</b>
  <span>বিজ্ঞাপনের জায়গা</span>
</section>
</main>

<footer>NEXORA © 2026 | Global Trade Marketplace</footer>

<script src="app.js"></script>
</body>
</html>
